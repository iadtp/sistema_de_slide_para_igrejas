<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Projeção</title>


    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        html,
        body {

            width: 100%;

            height: 100%;

            overflow: hidden;

        }


        body {

            background: black;

            color: white;

            font-family: Arial;

        }


        #tela {

            width: 100vw;

            height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 5vw;

        }


        #texto {

            max-width: 90%;

            white-space: pre-wrap;

            word-break: break-word;

            font-size: 60px;

            line-height: 1.4;

        }

    </style>

</head>


<body>


<div id="tela">

    <div id="texto"></div>

</div>


<script
    src="https://cdn.socket.io/4.7.5/socket.io.min.js">
</script>


<script
    src="{{ url_for('static', filename='js/projecao.js') }}">
</script>


</body>

</html>
